name: CI Verify

# Phase 1 of the GitHub Actions trial: runs alongside the Azure DevOps PR pipeline and is NOT
# a required check. Builds all modules, runs the unit tests, and publishes the five function
# app zips (the same artefacts the release pipeline ships) as downloadable workflow artefacts.
#
# The integration suite (ai-service-orchestration-test, profile ai-rag-integration-test) is
# deliberately not activated: it needs the airag-var service principal, Azure Functions Core
# Tools and network reachability to the dev Azure resources, none of which a GitHub-hosted
# runner has. It continues to run on the ADO PR pipeline.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit test and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, run unit tests and package function apps
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp -U -s .github/maven-settings.xml verify

      - name: Upload function app packages
        uses: actions/upload-artifact@v7
        with:
          name: function-app-packages
          path: ai-document-*-function/target/zip/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/site/jacoco/jacoco.xml
          if-no-files-found: warn
          retention-days: 14
